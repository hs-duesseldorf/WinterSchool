; Splats write depth (3 = expected depth: the opacity-weighted depth of the splats in each pixel) and velocity, so TSR
; and motion blur reproject them as surfaces instead of as the sky behind them (smearing / break-up when moving), and
; meshes, decals and fog are depth-tested against them.
