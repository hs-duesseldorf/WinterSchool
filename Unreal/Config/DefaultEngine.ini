[/Script/Engine.RendererSettings]
; The desktop renderer (editor, desktop builds) is set up like the web one (WebGPU mobile deferred), so what the editor
; shows is what the web shows: no Lumen GI or reflections (indirect light comes from the sky light, as on mobile), no
; virtual shadow maps (cascaded shadow maps, as on mobile), no distance fields or ray tracing, TAA like the web build.
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Shadow.Virtual.Enable=0
r.GenerateMeshDistanceFields=False
r.RayTracing=False
r.AntiAliasingMethod=2
r.AllowStaticLighting=False
r.SkinCache.CompileShaders=True
r.Substrate=False
; Effects the web build does not have, or the TempleMap post process volume turns off anyway
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=true
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=False
r.DefaultFeature.LensFlare=False

